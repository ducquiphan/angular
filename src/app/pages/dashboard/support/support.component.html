<div>
	<ul>
		@for (ticket of tickets(); track ticket.id) {
			<li>
				<app-ticket [ticket]="ticket" (close)="onCloseTicket(ticket.id ? ticket.id : '')"></app-ticket>
				<!-- - {{ $first }} -->
				<!-- - {{ $last }} -->
				<!-- - {{ $odd }} -->
				<!-- - {{ $even }} -->
				<!-- - {{ $count }} -->
			</li>
		} @empty {
			<p>No tickets available.</p>
		}
	</ul>
</div>
<app-new-ticket (add)="onAddTicket($event)"></app-new-ticket>
