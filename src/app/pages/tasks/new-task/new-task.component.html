<div (click)="onCancel()" class="backdrop"></div>
<dialog open>
	<h2 class="mb-3">Add Task</h2>
	<form (ngSubmit)="onSubmit()" nz-form>
		<nz-form-item>
			<nz-form-label class="font-color" nzFor="title">
				Title
			</nz-form-label>
			<nz-form-control>
				<input [(ngModel)]="title" id="title" name="title" nz-input type="text"/>
			</nz-form-control>
		</nz-form-item>
		<nz-form-item>
			<nz-form-label nzFor="summary">
				Summary
			</nz-form-label>
			<nz-form-control>
				<nz-textarea-count [nzMaxCharacterCount]="2000">
					<textarea [(ngModel)]="summary" id="summary" name="summary" nz-input nz-row="5"></textarea>
				</nz-textarea-count>
			</nz-form-control>
		</nz-form-item>
		<nz-form-item>
			<nz-form-label nzFor="due-date">
				Due Date
			</nz-form-label>
			<nz-form-control>
				<input [(ngModel)]="date" id="due-date" name="due-date" nz-input type="date"/>
			</nz-form-control>
		</nz-form-item>
		<nz-form-item class="actions">
			<button (click)="onCancel()" type="button">Cancel</button>
			<button type="submit">Create</button>
		</nz-form-item>
	</form>
</dialog>
