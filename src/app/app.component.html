<app-header></app-header>
<main>
	<ul id="users">
		@for (user of users; track user.id) {
			<li>
				<app-user (selectUser)="onSelectUser($event)" [selected]="user.id === selectedUser()?.id" [user]="user"></app-user>
			</li>
		}
	</ul>
	@if (selectedUser(); as user) {
		<app-tasks [user]="user" @fadeInOut></app-tasks>
	} @else {
		<p id="fallback" @fadeInOut>Select a user to see their task</p>
	}

</main>
