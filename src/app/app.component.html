<app-header></app-header>
<main>
	<ul id="users">
		<li>
			<app-user (selectUser)="onSelectUser($event)" [avatar]="users[0].avatar" [id]="users[0].id" [name]="users[0].name"></app-user>
		</li>
		<li>
			<app-user (selectUser)="onSelectUser($event)" [avatar]="users[1].avatar" [id]="users[1].id" [name]="users[1].name"></app-user>
		</li>
		<li>
			<app-user (selectUser)="onSelectUser($event)" [avatar]="users[2].avatar" [id]="users[2].id" [name]="users[2].name"></app-user>
		</li>
		<li>
			<app-user (selectUser)="onSelectUser($event)" [avatar]="users[3].avatar" [id]="users[3].id" [name]="users[3].name"></app-user>
		</li>
	</ul>
	<app-tasks [name]="selectedUser()?.name"></app-tasks>
</main>
